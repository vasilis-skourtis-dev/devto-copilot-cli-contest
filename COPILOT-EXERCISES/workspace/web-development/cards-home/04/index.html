<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Heart</title>
    <style>
        /* --- 1. PAGE SETUP --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec;
        }

        /* --- 2. THE MAIN CONTAINER (The "Canvas") --- */
        .heart-layout {
            position: relative;
            
            /* Responsive Width: 
               Occupies 90% of screen, but stops growing at 600px */
            width: 90%; 
            max-width: 600px;
            
            /* CRITICAL: Lock the Aspect Ratio 
               Replace '1 / 1' with your image's width / height.
               Example: If your image is 800x600, write: aspect-ratio: 800 / 600; */
            aspect-ratio: 1 / 1; 

            /* Stack Layers */
            display: grid;
            grid-template-areas: "stack"; 
        }

        /* --- 3. LAYER 1: THE BACKGROUND (Angel) --- */
        .layer-heart {
            grid-area: stack;
            width: 100%;
            height: 100%;
            /* 'cover' ensures no white bars, 'contain' ensures full image visible.
               Since we locked aspect-ratio above, 'cover' is usually safer/cleaner. */
            object-fit: cover; 
            z-index: 1;
        }

        /* --- 4. LAYER 2: THE UI OVERLAY --- */
        .layer-ui {
            grid-area: stack;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: grid;
            
            /* Vertical Positioning Strategy:
               1. Top Gap: 25% of the heart's height
               2. Bow Area: Auto-sized
               3. Bottom Gap: The rest */
            grid-template-rows: 25% auto 1fr; 
            grid-template-columns: 1fr auto 1fr;
        }

        /* --- 5. THE BOW (Now Fully Responsive) --- */
        .bow-container {
            grid-row: 2;
            grid-column: 2;
            align-self: start; 
            cursor: pointer;
            
            /* CENTERING TRICK: 
               Flexbox here centers the image inside this grid cell */
            display: flex;
            justify-content: center;
            width: 100%; 
        }

        .bow-img {
            /* THE FIX:
               Instead of '150px', we use percentage.
               The bow will always be 35% of the Heart's total width. */
            width: 35%; 
            height: auto; /* Maintains bow's own aspect ratio */
            
            transition: transform 0.1s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); /* Adds depth */
        }

        .bow-img:active {
            transform: scale(0.9); /* Tactile "press" effect */
        }

    </style>
</head>
<body>

    <div class="heart-layout">
        
        <img src="loveHeart.png" class="layer-heart" alt="Heart Background">

        <div class="layer-ui">
            
            <div class="bow-container" onclick="alert('You clicked the bow!')">
                <img src="loveHeartBow.png" class="bow-img" alt="Bow">
            </div>

        </div>

    </div>

</body>
</html>
