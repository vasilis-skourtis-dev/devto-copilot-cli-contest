# ============================================
# Valentine Cards Application Configuration
# ============================================

# Application Info
spring.application.name=valentine-cards
server.port=8080

# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================
# Multipart File Upload Configuration
# ============================================
# Max file size (5MB for images with steganography)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================
# Email Configuration (Optional - for sending cards)
# ============================================
# Set to true to enable email sending
valentine.cards.email.enabled=false
#valentine.cards.email.enabled=true

# Gmail SMTP Configuration (Example - Update with your credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Alternative: Other Email Providers
# For Outlook: smtp.office365.com:587
# For Yahoo: smtp.mail.yahoo.com:587

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.org.vs.valentine.cards=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.mail=DEBUG

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# Static Resources Configuration
# ============================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.max-age=3600

# ============================================
# Server Configuration
# ============================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================
# Developer Notes
# ============================================
# To enable email sending:
# 1. Set valentine.cards.email.enabled=true
# 2. Update spring.mail.username with your email
# 3. For Gmail, create an "App Password" in your Google Account settings
#    (Security > 2-Step Verification > App passwords)
# 4. Use the app password in spring.mail.password
#
# Without email configuration, cards are still created but not sent.
# Users can download the generated image manually.
